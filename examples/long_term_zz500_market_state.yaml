# zz500 分组训练示例；如需覆盖连接，复制原配置中的 debug_connection 段。
base_name: long_term_zz500_market_state
manual_seed: 2023
n_jobs: 1
eval_rt: false

dataset:
  factor_table_groups: ['long_term_factor_table_15s']
  ret_table:
    dfs://DDB_Returns: 'Returns_long_short_zz500'
  training_factor_name: ['long_term_base_factor_15s']
  derived_factor_name: ['long_term_derived_factor_15s']
  std_factor_name: ['long_term_std_factor_15s']
  clip_factor_name: ['long_term_clip_factor_15s']
  log_factor_name: ['long_term_log_factor']
  rebalancing_tables: []
  type: 'FactorLongTermDataset'
  # 示例：2026 年 1 月训练，2 月测试；按实际有标签的月份调整。
  test_month: [202602]
  training_month_num: 1
  io_backend: ddb
  pool_name: zz500
  indus_table_suffix: ''
  indus_class: group_id
  avg_price: 10
  price_name: highprice
  ret_name: long10min
  long_ret_name: long_ret_10min
  short_ret_name: short_ret_10min
  long_term_window_config:
    1m: 4
    5m: 20
    10m: 40
    30m: 120
  std_type: default
  drop_null_in_training: false
  alpha: 0.0005
  class_num: 2
  balance: default

model:
  type: LgbmModel
  n_cpus: 4

train:
  by_market_state: true  # 唯一新增开关；删除或设为 false 即恢复原训练方式。
  num_epoch: 200
  save_proba: false

test:
  bound_mode: by_ticker
  threshold_pct: 10
