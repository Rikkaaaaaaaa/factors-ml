base_name: hk_highprice_lgbm
manual_seed: 2023
n_jobs: 1
eval_rt: false

# factor dataset
dataset:
  # factor name options
  factor_table:
    dfs://S_EQ_ALGO_HK: ['hk_factors_15s']
  ret_table:
    dfs://S_EQ_ALGO: 'hk_return_a_like'
  # read from dataset/factor_name.py
  training_factor_name: ['ddb_test_factor']
  std_factor_name: ['ddb_test_factor']
  clip_factor_name: ['ddb_test_factor']
  log_factor_name: ['log_factor']
  rebalancing_tables: []

  # data preprocessing options
  type: 'FactorHKDataset'
  test_month: [202606]
  training_month_num: 1
  io_backend: ddb # disk
  pool_name: 'hk'
  indus_table_suffix: ''
  indus_class: group_id
  avg_price: 10
  price_name: highprice
  ret_name: 15s
  std_type: default # trainingset std
  drop_null_in_training: false
  alpha: 0.0005
  class_num: 2
  balance: default
  trading_hours:
    am_start_time: 93000
    am_end_time: 120000
    pm_start_time: 130000
    pm_end_time: 160000

model:
  type: 'LgbmModel'
  n_cpus: 8

train:
  num_epoch: 200
  save_proba: true

test:
  bound_mode: by_ticker # indus/ticker
  threshold_pct: 40



