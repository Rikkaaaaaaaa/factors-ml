name: batch4_factor_genetic_div_open_no_reverse_hs300_highprice_lr_15s
manual_seed: 2023
n_jobs: 8

# factor dataset
dataset:
  # factor name options
  factor_table:
    strategy: ['factor']
    factor_test: [ 'ofl_factor', 'fok_factor', 'slope_factor', 'genetic_programming_factor_2_div_open']
  training_factor_name: [ 'base_factor', 'ofl_factor', 'fok_factor', 'slope_factor', 'genetic_programming_factor_2_div_open' ]
  std_factor_name: [ 'base_factor', 'ofl_factor' , 'slope_factor', 'genetic_programming_factor_2_div_open']
  clip_factor_name: [ 'base_factor', 'ofl_factor', 'slope_factor', 'genetic_programming_factor_2_div_open']
  log_factor_name: [ 'log_factor' ]

  # data preprocessing options
  type: 'FactorDataset'
  test_month: [ 202304,202305,202306,202307,202308,202309,202310,202311 ]
  io_backend: sql # disk
  pool_name: ['hs300']
  indus_class: wind1
  avg_price: 10
  price_name: highprice
  ret_name: 15s
  std_type: default # trainingset std
  alpha: 0.0005
  class_num: 2


model:
  type: 'LRModel'
  n_cpus: 8

train:
  num_epoch: 200
test:
  bound_mode: by_ticker # indus/ticker
  threshold_pct: 40



