name: ofl_hs300_highprice_lr_300s
manual_seed: 2023
n_jobs: 11

# factor dataset
dataset:
  type: 'FactorDataset'
  # factor name options
  factor_table:
    strategy: ['factor']
    factor_test: [ 'ofl_factor']
  training_factor_name: [ 'base_factor', 'ofl_factor' ]
  std_factor_name: [ 'base_factor', 'ofl_factor' ]
  clip_factor_name: [ 'base_factor', 'ofl_factor' ]
  log_factor_name: [ 'log_factor' ]

  # data preprocessing options
  test_month: [ 202304 ]
  io_backend: sql # disk
  pool_name: ['hs300']
  indus_class: wind1
  price_name: highprice
  ret_name: 300s
  std_type: default # training set std
  avg_price: 10
  alpha:  0.001 # or dynamic_rolling
  class_num: 2


model:
  type: 'LRModel'

train:
  num_epoch: 200

test:
  bound_mode: by_ticker # indus or ticker
  threshold_pct: 5




