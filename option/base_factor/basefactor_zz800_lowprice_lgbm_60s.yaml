name: base_factor_zz800_lowprice_lgbm_60s
manual_seed: 2023
n_jobs: 8


# factor dataset
dataset:
  # factor name options
  factor_db: 'strategy'
  factor_table: 'factor'
  training_factor_name: [ 'base_factor' ]
  std_factor_name: [ 'base_factor', ]
  clip_factor_name: [ 'base_factor', ]
  log_factor_name: [ 'log_factor' ]
  reversed_factor_name: [ 'base_factor' ]

  # data preprocessing options
  type: 'FactorDataset'
  test_month: [202312 ]
  io_backend: sql # disk
  pool_name: ['hs300', 'zz500']
  indus_class: wind1
  avg_price: 10
  price_name: lowprice
  ret_name: 60s
  std_type: default # trainingset std
  alpha: 0.0005
  class_num: 2
  balance: reverse


model:
  type: 'LgbmModel'
  n_cpus: 8

train:
  num_epoch: 200
test:
  bound_mode: by_ticker # indus/ticker
  threshold_pct: 20





