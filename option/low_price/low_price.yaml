name: low_price_hs300_lgbm
eval_rt: false

# factor dataset
dataset:
  # factor name options
  factor_table:
    dfs://DDB_Factor_15s: ['BaseFokFactor', 'SlopeOflFactor', 'GPFactor']
  # read from dataset/factor_name.py
  training_factor_name: [ 'ddb_base_factor', 'ddb_base_factor_ret', 'ddb_fok_factor', 'ddb_ofl_factor', 'ddb_slope_factor', 'ddb_gp_factor']
  std_factor_name: [ 'ddb_base_factor', 'ddb_base_factor_ret', 'ddb_slope_std_factor', 'ddb_gp_factor']
  clip_factor_name: [ 'ddb_base_factor', 'ddb_ofl_factor', 'ddb_slope_factor', 'ddb_gp_factor']
  log_factor_name: [ 'log_factor' ]
  rebalancing_tables: ['BaseFokFactor', 'SlopeOflFactor', 'GPFactor']

  # data preprocessing options
  type: 'GenDatasetLowPrice'
  test_month: [202507]
  pool_name: 'hs300'
  indus_class: price_group
  indus_table_suffix: ''
  io_backend: ddb

train:
  save_proba: false

model:
  type: 'LogitModel'
  n_cpus: 8

save_signal:
  save_signal_to_sql: true
  sql_table_name: signal_hs300_low_price_logit_test
  sql_database: strategy

# low price customize
n_jobs_read_data: 10
is_realtime: false
bs_flag_list: ['b', 's']
tick_ahead : 1

