name: gen_factor_hs300_highprice
manual_seed: 2023
n_jobs: 8

# factor dataset
dataset:
  # factor name options
  factor_table:
    strategy: ['factor']
    factor_test: [ 'ofl_factor', 'fok_factor', 'slope_factor', 'genetic_programming_factor_1']
  training_factor_name: [ 'base_factor', 'ofl_factor', 'fok_factor', 'slope_factor', 'genetic_programming_factor_1' ]
  std_factor_name: [ 'base_factor', 'ofl_factor_std', 'slope_factor_std', 'genetic_programming_factor_1']
  clip_factor_name: [ 'base_factor', 'ofl_factor', 'slope_factor', 'genetic_programming_factor_1']
  log_factor_name: [ 'log_factor' ]

  # data preprocessing options
  type: 'GenDataset'
  test_month: [202311]
  io_backend: sql # disk
  pool_name: ['hs300']
  indus_class: wind1
  avg_price: 10
  price_name: highprice
  ret_name: 15s
  std_type: default # trainingset std






