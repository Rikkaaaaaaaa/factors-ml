name: test_hs300_highprice_lgbm_300s
manual_seed: 2023
n_jobs: 4

# factor dataset
dataset:
  type: 'FactorDataset'
  # factor name options
  factor_db: 'factor_test'
  factor_table: 'all_factor'
  training_factor_name: ['batch2_factor']
  std_factor_name: ['base_factor', 'slope_factor',]
  clip_factor_name: ['base_factor', 'ofl_factor', 'slope_factor']
  log_factor_name: ['log_factor']
  reversed_factor_name: ['batch2_factor']

  # data preprocessing options
  test_month: [ 202304 ]
  io_backend: sql # disk
  pool_name: ['hs300']
  indus_class: wind1
  price_name: highprice
  ret_name: 300s
  std_type: default # training set std
  balance: reverse
  avg_price: 10
  alpha: 0.001
  class_num: 2

factor_selection:
  selected_factor_num: 128

model:
  type: 'LgbmModel'
  n_cpus: 8

train:
  num_epoch: 200

test:
  bound_mode: by_ticker # indus or ticker
  threshold_pct: 5




