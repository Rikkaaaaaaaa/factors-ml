name: opt_base_factor_hs300_highprice_lgbm_15s
manual_seed: 2023
n_jobs: 8

# factor dataset
dataset:
  type: 'FactorDataset'
  # factor name options
  factor_table:
    strategy: ['factor']
  training_factor_name: [ 'base_factor' ]
  std_factor_name: [ 'base_factor',  ]
  clip_factor_name: [ 'base_factor', ]
  log_factor_name: [ 'log_factor' ]
  reversed_factor_name: [ 'base_factor' ]
  # data preprocessing options
  test_month: [ 202304 ]
  io_backend: sql # disk
  pool_name: ['hs300']
  indus_class: wind1
  price_name: highprice
  ret_name: 15s
  std_type: default # training set std
  balance: reverse
  avg_price: 10
  alpha:  0.0005 # or dynamic_rolling
  class_num: 2

model:
  type: 'LgbmModel'
  n_cpus: 8

train:
  num_epoch: 200

test:
  bound_mode: by_ticker # indus or ticker
  threshold_pct: 5




