name: test_pct20_base_factor_zz800_highprice_lgbm_120s
manual_seed: 2023
n_jobs: 8


# factor dataset
dataset:
  # factor name options
  factor_table:
    strategy: ['factor']
  training_factor_name: [ 'base_factor' ]
  std_factor_name: [ 'base_factor', ]
  clip_factor_name: [ 'base_factor', ]
  log_factor_name: [ 'log_factor' ]
  reversed_factor_name: [ 'base_factor' ]

  # data preprocessing options
  type: 'FactorDataset'
  test_month: [ 202308, 202309, 202310, 202311 ]
  io_backend: sql # disk
  pool_name: ['hs300', 'zz500']
  indus_class: wind1
  avg_price: 10
  price_name: highprice
  ret_name: 120s
  std_type: default # trainingset std
  alpha: 0.0005
  class_num: 2
  balance: reverse


model:
  type: 'LgbmModel'
  n_cpus: 8

train:
  num_epoch: 200
test:
  bound_mode: by_ticker # indus/ticker
  threshold_pct: 20





