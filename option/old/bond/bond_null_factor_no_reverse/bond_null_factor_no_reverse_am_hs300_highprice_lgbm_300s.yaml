name: bond_null_factor_no_reverse_am_bond_etf_highprice_lgbm_300s
manual_seed: 2023
n_jobs: 8
eval_rt: false

# factor dataset
dataset:
  # factor name options
  factor_table:
    dfs://DDB_Factor_15s: ['BaseFokFactor_bond_etf', 'SlopeOflFactor_bond_etf', 'GPFactor_bond_etf']
  # read from dataset/factor_name.py
  training_factor_name: [ 'ddb_base_factor_bond_etf', 'ddb_fok_factor', 'ddb_ofl_factor', 'ddb_slope_factor', 'ddb_gp_factor_bond_etf']
  std_factor_name: [ 'ddb_base_factor_bond_etf', 'ddb_slope_std_factor', 'ddb_gp_factor_bond_etf']
  clip_factor_name: [ 'ddb_base_factor_bond_etf', 'ddb_ofl_factor', 'ddb_slope_factor', 'ddb_gp_factor_bond_etf']
  log_factor_name: [ 'log_factor' ]
  rebalancing_tables: []
  ret_table:
      dfs://DDB_Returns:  'Returns_bond_etf'

  # data preprocessing options
  type: 'FactorDataset'
  test_month: [202501, 202502, 202503, 202504, 202505, 202506]
  training_month_num: 6
  io_backend: ddb # disk
  pool_name: ['bond_etf']
  indus_table_suffix: ''
  indus_class: group_id
  avg_price: 0
  price_name: highprice
  ret_name: 300s
  trading_hours:
    am_start_time: 94000
    am_end_time: 113000
    pm_start_time: 145715
    pm_end_time: 145700
  std_type: default # trainingset std
  drop_null_in_training: false
  alpha: 0.00006
  class_num: 2
  balance: default

model:
  type: 'LgbmModel'
  n_cpus: 8

train:
  num_epoch: 200
  save_proba: true
test:
  bound_mode: by_ticker # indus/ticker
  threshold_pct: 20



