name: ddb_null_factor_no_reverse_CTL_hs300_highprice_lgbm_300s
manual_seed: 2023
n_jobs: 8
eval_rt: false

# factor dataset
dataset:
  # factor name options
  factor_table:
    dfs://DDB_Factor_15s: ['BaseFokFactor', 'SlopeOflFactor', 'GPFactor']
  ret_table:
    dfs://DDB_Returns: 'Returns_CTL'
  # read from dataset/factor_name.py
  training_factor_name: [ 'ddb_base_factor', 'ddb_fok_factor', 'ddb_ofl_factor', 'ddb_slope_factor', 'ddb_gp_factor']
  std_factor_name: [ 'ddb_base_factor', 'ddb_slope_std_factor', 'ddb_gp_factor']
  clip_factor_name: [ 'ddb_base_factor', 'ddb_ofl_factor', 'ddb_slope_factor', 'ddb_gp_factor']
  log_factor_name: [ 'log_factor' ]
  rebalancing_tables: ['BaseFokFactor', 'SlopeOflFactor', 'GPFactor']

  # data preprocessing options
  type: 'FactorDataset'
  test_month: [202507]
  training_month_num: 6
  io_backend: ddb # disk
  pool_name: 'hs300'
  indus_table_suffix: ''
  indus_class: group_id
  avg_price: 10
  price_name: highprice
  ret_name: 300s
  std_type: default # trainingset std
  drop_null_in_training: false
  alpha: 0.001
  class_num: 2
  balance: default

model:
  type: 'LgbmModel'
  n_cpus: 8

train:
  num_epoch: 200
  save_proba: true
test:
  bound_mode: by_ticker # indus/ticker
  threshold_pct: 20



